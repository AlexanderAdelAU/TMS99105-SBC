<svg xmlns="http://www.w3.org/2000/svg" width="680" height="452" viewBox="0 0 680 452" font-family="Helvetica, Arial, sans-serif">
<title>SMALLC99 memory layout</title>
<rect width="680" height="452" fill="#FFFFFF"/>
<rect x="40" y="30" width="600" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="49" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">Segment 0  &gt;0000–&gt;0FFF</text>
<text x="340" y="66" text-anchor="middle" font-size="12" fill="#5F5E5A">Common: shell workspace, FCB, BDOS gate, stack</text>
<rect x="40" y="88" width="600" height="148" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Segments 1–7  Segments 1–7  &gt;1000–&gt;726F  resident, page 0 (25,200 bytes)gt;1000–Segments 1–7  &gt;1000–&gt;726F  resident, page 0 (25,200 bytes)gt;7857  resident, page 0 (26,712 bytes)</text>
<text x="340" y="130" text-anchor="middle" font-size="12" fill="#0F6E56">Always mapped: every overlay can call it directly</text>
<g font-size="12" text-anchor="middle">
<rect x="55" y="148" width="108" height="72" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="109" y="178" font-size="14" font-weight="bold" fill="#444441">Driver</text><text x="109" y="197" fill="#5F5E5A">main, PORT_INIT</text>
<rect x="171" y="148" width="108" height="72" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="225" y="178" font-size="14" font-weight="bold" fill="#444441">Scanner</text><text x="225" y="197" fill="#5F5E5A">symtab, litq</text>
<rect x="287" y="148" width="108" height="72" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="341" y="178" font-size="14" font-weight="bold" fill="#444441">Bridges</text><text x="341" y="197" fill="#5F5E5A">parse, wrappers</text>
<rect x="403" y="148" width="108" height="72" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="457" y="178" font-size="14" font-weight="bold" fill="#444441">Output</text><text x="457" y="197" fill="#5F5E5A">gen, stage[400]</text>
<rect x="519" y="148" width="108" height="72" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="573" y="178" font-size="14" font-weight="bold" fill="#444441">Overlays</text><text x="573" y="197" fill="#5F5E5A">OVLMGR, stubs</text>
</g>
<rect x="40" y="250" width="600" height="112" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">Segments 8–B  &gt;8000–&gt;BFFF  overlay window, 16K</text>
<text x="340" y="292" text-anchor="middle" font-size="12" fill="#534AB7">One overlay owns it at a time; segment 8 = the owner</text>
<g font-size="14" font-weight="bold" fill="#3C3489" text-anchor="middle">
<rect x="55" y="304" width="138" height="44" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/><text x="124" y="331">Seg 8  &gt;8000</text>
<rect x="201" y="304" width="138" height="44" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/><text x="270" y="331">Seg 9  &gt;9000</text>
<rect x="347" y="304" width="138" height="44" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/><text x="416" y="331">Seg A  &gt;A000</text>
<rect x="493" y="304" width="134" height="44" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/><text x="560" y="331">Seg B  &gt;B000</text>
</g>
<rect x="40" y="376" width="600" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="395" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">Segments C–F  &gt;C000–&gt;FFFF</text>
<text x="340" y="412" text-anchor="middle" font-size="12" fill="#5F5E5A">Shell (C, D), BDOS (E), ROM (F): never written by SMALLC99</text>
</svg>
